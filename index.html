<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <h1>Password Generator</h1>

        <div class="password-display">
            <div class="password-text" id="passwordDisplay">Click Generate to create password</div>
            <div class="password-actions">
                <button class="btn" id="copyBtn" title="Copy to clipboard">
                    <i class="far fa-clipboard"></i>
                </button>
                <button class="btn" id="refreshBtn" title="Generate new password">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <div class="strength-label" id="strengthLabel">Strength: N/A</div>
        <div class="strength-meter">
            <div class="strength-progress" id="strengthProgress"></div>
        </div>

        <div class="length-container">
            <div class="length-header">
                <span class="option-label">Password Length</span>
                <span class="length-value" id="lengthValue">12</span>
            </div>
            <input type="range" min="4" max="32" value="12" class="slider" id="lengthSlider">
        </div>

        <div class="options">
            <div class="option-item">
                <span class="option-label">Include Uppercase</span>
                <label class="checkbox-container">
                    <input type="checkbox" id="uppercaseCheck" checked>
                    <span class="checkmark"></span>
                </label>
            </div>

            <div class="option-item">
                <span class="option-label">Include Lowercase</span>
                <label class="checkbox-container">
                    <input type="checkbox" id="lowercaseCheck" checked>
                    <span class="checkmark"></span>
                </label>
            </div>

            <div class="option-item">
                <span class="option-label">Include Numbers</span>
                <label class="checkbox-container">
                    <input type="checkbox" id="numbersCheck" checked>
                    <span class="checkmark"></span>
                </label>
            </div>

            <div class="option-item">
                <span class="option-label">Include Symbols</span>
                <label class="checkbox-container">
                    <input type="checkbox" id="symbolsCheck" checked>
                    <span class="checkmark"></span>
                </label>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">
            <i class="fas fa-key"></i> Generate Password
        </button>
    </div>

    <div class="copy-alert" id="copyAlert">Password copied to clipboard!</div>

    <script src="./script.js">
       
    </script>
</body>
</html>
